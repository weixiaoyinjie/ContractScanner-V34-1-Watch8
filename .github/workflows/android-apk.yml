
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Source tests
        run: node tests/core.test.js && node tests/minute.test.js && node tests/quick-nav.test.js && node tests/engine-v33.test.js && node tests/ui-regression.test.js && node tests/wear-link.test.js

      - name: Build phone and Wear OS debug APKs
        run: gradle --no-daemon --stacktrace :app:assembleDebug :wear:assembleDebug

      - name: Upload phone APK
        uses: actions/upload-artifact@v4
        with:
          name: ContractScanner-V34-1-Phone-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload Wear OS APK
        uses: actions/upload-artifact@v4
        with:
          name: ContractScanner-V34-1-Wear-APK
          path: wear/build/outputs/apk/debug/wear-debug.apk
          if-no-files-found: error
