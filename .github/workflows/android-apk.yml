name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Prepare full project source
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f settings.gradle || ! -f app/build.gradle || ! -f wear/build.gradle ]]; then
            ZIP_FILE=""
            for candidate in ContractScanner_V34_1_SDK_Fix_Source.zip ContractScanner_V34_1_Watch8_5m15m24h_PhoneAlerts_Source.zip; do
              if [[ -f "$candidate" ]]; then
                ZIP_FILE="$candidate"
                break
              fi
            done
            if [[ -z "$ZIP_FILE" ]]; then
              echo "::error::Missing Android project. Upload ContractScanner_V34_1_SDK_Fix_Source.zip to the repository root."
              exit 1
            fi
            echo "Extracting project source from $ZIP_FILE"
            unzip -oq "$ZIP_FILE" -d . -x '.github/*'
          fi
          for required in settings.gradle build.gradle app/build.gradle wear/build.gradle tests/core.test.js; do
            if [[ ! -f "$required" ]]; then
              echo "::error::Missing $required. Upload the complete source ZIP."
              exit 1
            fi
          done
          echo "Phone + Wear OS source verified."

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify preinstalled Android SDK 35
        shell: bash
        run: |
          set -e
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt2"
          echo "Android SDK 35 verified."

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Source tests
        run: |
          node tests/core.test.js
          node tests/minute.test.js
          node tests/quick-nav.test.js
          node tests/engine-v33.test.js
          node tests/ui-regression.test.js
          node tests/wear-link.test.js

      - name: Build phone and Wear OS debug APKs
        run: gradle --no-daemon --stacktrace :app:assembleDebug :wear:assembleDebug

      - name: Upload phone APK
        uses: actions/upload-artifact@v4
        with:
          name: ContractScanner-V34-1-Phone-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload Wear OS APK
        uses: actions/upload-artifact@v4
        with:
          name: ContractScanner-V34-1-Wear-APK
          path: wear/build/outputs/apk/debug/wear-debug.apk
          if-no-files-found: error
