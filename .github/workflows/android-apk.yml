name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Prepare full project source
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f settings.gradle || ! -f app/build.gradle || ! -f wear/build.gradle ]]; then
            ZIP_FILE=""
            for candidate in ContractScanner_V34_2_Java_Fix_Source.zip ContractScanner_V34_1_SDK_Fix_Source.zip ContractScanner_V34_1_Watch8_5m15m24h_PhoneAlerts_Source.zip; do
              if [[ -f "$candidate" ]]; then
                ZIP_FILE="$candidate"
                break
              fi
            done
            if [[ -z "$ZIP_FILE" ]]; then
              echo "::error::Missing full project source ZIP in repository root."
              exit 1
            fi
            echo "Extracting phone and Watch 8 source from $ZIP_FILE"
            unzip -oq "$ZIP_FILE" -d . -x '.github/*'
          fi
          for required in settings.gradle build.gradle app/build.gradle wear/build.gradle tests/core.test.js; do
            if [[ ! -f "$required" ]]; then
              echo "::error::Missing required file $required after extraction."
              exit 1
            fi
          done

      - name: Fix AlertStore JSON compilation errors
        shell: bash
        run: |
          python3 - <<'PYFIX'
          from pathlib import Path
          p=Path('app/src/main/java/com/contractresearch/flowplusminute/AlertStore.java')
          s=p.read_text(encoding='utf-8')
          corrections=[
              (
                  'live.priceEnabled=false;if(live.active())a.put(snapshot.symbol,live.toJson());else a.remove(snapshot.symbol);',
                  'live.priceEnabled=false;\n        try { if(live.active()) a.put(snapshot.symbol,live.toJson()); else a.remove(snapshot.symbol); }\n        catch(org.json.JSONException ex) { return false; }'
              ),
              (
                  'if(live.active())a.put(live.symbol,live.toJson());else a.remove(live.symbol);',
                  'try { if(live.active()) a.put(live.symbol,live.toJson()); else a.remove(live.symbol); }\n        catch(org.json.JSONException ex) { return false; }'
              ),
          ]
          for old,new in corrections:
              new=new.replace('\n','\n')
              if old in s:
                  assert s.count(old)==1, 'Unexpected duplicate expression; inspect AlertStore.java'
                  s=s.replace(old,new,1)
              elif new not in s:
                  raise SystemExit('Unexpected AlertStore.java version; cannot safely apply the Java fix')
          p.write_text(s, encoding='utf-8')
          assert s.count('catch(org.json.JSONException ex) { return false; }') == 2
          print('Checked JSONExceptions now handled in phone AlertStore.priceHit/timerDue')
          PYFIX

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify preinstalled Android SDK 35
        shell: bash
        run: |
          set -e
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt2"
          echo "Android SDK 35 verified"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Source tests
        run: |
          node tests/core.test.js
          node tests/minute.test.js
          node tests/quick-nav.test.js
          node tests/engine-v33.test.js
          node tests/ui-regression.test.js
          node tests/wear-link.test.js

      - name: Build phone and Wear OS debug APKs
        run: gradle --no-daemon --stacktrace :app:assembleDebug :wear:assembleDebug

      - name: Upload phone APK
        uses: actions/upload-artifact@v4
        with:
          name: ContractScanner-V34-2-Phone-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload Wear OS APK
        uses: actions/upload-artifact@v4
        with:
          name: ContractScanner-V34-2-Wear-APK
          path: wear/build/outputs/apk/debug/wear-debug.apk
          if-no-files-found: error
